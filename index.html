<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>my-tube</title>
    <script>
      // Apply the saved theme before first paint (dark is the default).
      (function () {
        var theme = 'dark';
        try {
          if (localStorage.getItem('mytube:theme:v1') === 'light') theme = 'light';
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="logo" aria-hidden="true">▶</span><span>my-tube</span></div>
      <nav class="tabs" aria-label="Main">
        <button class="tab" type="button" data-view="dashboard">Dashboard</button>
        <button class="tab" type="button" data-view="videos">Videos</button>
        <button class="tab" type="button" data-view="channels">Channels</button>
      </nav>
      <div class="actions">
        <span id="last-refreshed" class="status-line" role="status"></span>
        <button id="refresh-btn" class="btn ghost" type="button">Refresh</button>
        <button id="theme-btn" class="btn ghost" type="button">Light mode</button>
      </div>
    </header>

    <main class="content">
      <section id="view-dashboard" class="view" aria-label="Dashboard">
        <div id="dashboard" class="dashboard-grid"></div>
      </section>

      <section id="view-videos" class="view" aria-label="Videos" hidden>
        <div class="toolbar">
          <label for="channel-filter">Channel</label>
          <select id="channel-filter">
            <option value="all">All channels</option>
          </select>
          <span id="video-count" class="status-line"></span>
        </div>
        <div id="videos" class="video-grid"></div>
      </section>

      <section id="view-channels" class="view" aria-label="Channels" hidden>
        <section class="panel">
          <h2>YouTube API key</h2>
          <p class="muted small">
            Videos are loaded with your own free YouTube Data API v3 key. It is stored only in this
            browser. Create one in the
            <a href="https://console.cloud.google.com/apis/credentials" target="_blank" rel="noopener noreferrer">Google Cloud console</a>
            and restrict it to your site's HTTP referrer.
          </p>
          <form id="api-key-form" class="add-form">
            <label for="api-key-input">API key</label>
            <input id="api-key-input" name="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="AIza…" />
            <button type="submit" class="btn primary">Save key</button>
            <button id="api-key-clear" type="button" class="btn danger">Remove key</button>
            <p id="api-key-status" class="status-line"></p>
          </form>
        </section>
        <section class="panel">
          <h2>Add a channel</h2>
          <form id="add-channel-form" class="add-form">
            <label for="channel-input">Channel ID, @handle, or channel URL</label>
            <input
              id="channel-input"
              name="channel"
              type="text"
              placeholder="@veritasium, UC…, or https://www.youtube.com/@veritasium"
              autocomplete="off"
            />
            <button type="submit" class="btn primary">Add</button>
            <p id="add-error" class="error-message" hidden></p>
          </form>
        </section>
        <section class="panel">
          <h2>Your channels</h2>
          <ul id="channels" class="channel-list"></ul>
        </section>
      </section>
    </main>

    <dialog id="player" class="player" aria-labelledby="player-title">
      <div class="player-box">
        <header class="player-head">
          <h2 id="player-title" class="player-title"></h2>
          <button id="player-close" class="btn ghost small" type="button">Close</button>
        </header>
        <div class="player-frame">
          <iframe
            id="player-frame"
            title="Video player"
            allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
            allowfullscreen
            referrerpolicy="strict-origin-when-cross-origin"
          ></iframe>
        </div>
        <footer class="player-foot">
          <a id="player-open" class="btn ghost small" target="_blank">Open on YouTube</a>
        </footer>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
